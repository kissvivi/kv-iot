<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">kv-iot 服务架构</title>
  <desc id="desc">Vue 管理端和设备移动端通过 HTTP JSON API 访问认证、设备管理和数据中心服务，并连接 MySQL、Redis、InfluxDB 和 MQTT。</desc>
  <defs>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1200" height="740" rx="16" fill="#f6f8fb"/>
  <text x="56" y="52" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">kv-iot 服务架构</text>
  <text x="56" y="82" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#64748b">前后端分离的多服务架构，前端通过独立 HTTP API 访问认证、设备管理和数据中心服务。</text>
  <rect x="1000" y="32" width="144" height="30" rx="15" fill="#e8f7ee" stroke="#bbebc9"/>
  <text x="1072" y="52" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" font-weight="600" fill="#15803d">Vue 3 + Go</text>

  <text x="56" y="120" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">访问层</text>
  <rect x="40" y="96" width="1120" height="132" rx="14" fill="#eef4ff" stroke="#d4e1fb"/>
  <rect x="76" y="132" width="374" height="72" rx="10" fill="#ffffff" stroke="#c7d8f8"/>
  <rect x="96" y="150" width="52" height="24" rx="12" fill="#e8f0ff"/>
  <text x="122" y="167" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="700" fill="#2563eb">WEB</text>
  <text x="164" y="161" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">Web 管理端</text>
  <text x="164" y="185" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#64748b">产品 · 物模型 · 设备 · 通道 · 运行监控 · 系统管理</text>

  <rect x="560" y="132" width="374" height="72" rx="10" fill="#ffffff" stroke="#c7d8f8"/>
  <rect x="580" y="150" width="68" height="24" rx="12" fill="#e8f0ff"/>
  <text x="614" y="167" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="700" fill="#2563eb">MOBILE</text>
  <text x="662" y="161" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">设备移动端</text>
  <text x="662" y="185" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#64748b">二维码访问 · 设备状态 · 最新采样 · 可用动作</text>

  <rect x="968" y="146" width="156" height="44" rx="8" fill="#ffffff" stroke="#d4e1fb"/>
  <text x="1046" y="164" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">HTTP / JSON API</text>
  <text x="1046" y="181" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#94a3b8">JWT 认证</text>

  <path d="M263 204 V240 M747 204 V240 M205 240 H930" fill="none" stroke="#7c8ea8" stroke-width="2"/>
  <path d="M205 240 V288 M540 240 V288 M930 240 V288" fill="none" stroke="#7c8ea8" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <rect x="547" y="229" width="112" height="22" rx="11" fill="#f6f8fb"/>
  <text x="603" y="244" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">HTTP / JSON</text>

  <text x="56" y="282" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">服务层</text>
  <rect x="80" y="298" width="260" height="158" rx="12" fill="#ffffff" stroke="#bbebc9" stroke-width="2"/>
  <rect x="80" y="298" width="6" height="158" rx="3" fill="#16a34a"/>
  <text x="104" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">认证服务</text>
  <text x="104" y="353" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#15803d">auth · :8101</text>
  <text x="104" y="384" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">JWT 登录与令牌校验</text>
  <text x="104" y="408" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">RBAC 角色与权限</text>
  <text x="104" y="432" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">用户、角色、模块资源</text>

  <rect x="390" y="298" width="300" height="158" rx="12" fill="#ffffff" stroke="#bbebc9" stroke-width="2"/>
  <rect x="390" y="298" width="6" height="158" rx="3" fill="#16a34a"/>
  <text x="414" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">设备管理服务</text>
  <text x="414" y="353" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#15803d">device · :8100</text>
  <text x="414" y="384" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">产品、物模型、协议版本</text>
  <text x="414" y="408" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">点位绑定、设备与通道配置</text>
  <text x="414" y="432" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">设备连接与共享信息</text>

  <rect x="740" y="298" width="380" height="158" rx="12" fill="#fffaf0" stroke="#f6cc87" stroke-width="2"/>
  <rect x="740" y="298" width="6" height="158" rx="3" fill="#d97706"/>
  <text x="764" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">数据中心服务</text>
  <text x="764" y="353" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#b45309">datacenter · :8102</text>
  <text x="764" y="384" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">Runtime API · 通道运行时 · 状态与时序</text>
  <text x="764" y="408" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">命令下发 · 审计记录 · 事件查询</text>
  <text x="764" y="432" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#b45309">协议驱动：MQTT · Modbus TCP · TCP Raw · TCP Frame</text>

  <text x="56" y="500" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">数据与接入基础设施</text>
  <path d="M210 456 V520" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <path d="M540 456 V482 H310 V520" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <path d="M900 456 V490 H490 V520" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M970 456 V504 H760 V520" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M1040 456 V520" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="354" y="491" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#15803d">配置数据</text>
  <text x="676" y="501" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#b45309">运行状态 / 历史采样 / MQTT 接入</text>

  <rect x="80" y="520" width="250" height="104" rx="10" fill="#f7f3ff" stroke="#d9cdf5"/>
  <text x="100" y="551" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5b21b6">MySQL</text>
  <text x="100" y="576" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">用户、权限、产品、物模型</text>
  <text x="100" y="598" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">设备、点位、通道配置</text>

  <rect x="360" y="520" width="250" height="104" rx="10" fill="#f7f3ff" stroke="#d9cdf5"/>
  <text x="380" y="551" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5b21b6">Redis</text>
  <text x="380" y="576" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">分布式最新运行状态</text>
  <text x="380" y="598" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">可选，未配置时使用内存</text>

  <rect x="640" y="520" width="250" height="104" rx="10" fill="#f7f3ff" stroke="#d9cdf5"/>
  <text x="660" y="551" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5b21b6">InfluxDB</text>
  <text x="660" y="576" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">历史时序与设备采样</text>
  <text x="660" y="598" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">不可用时保留内存历史</text>

  <rect x="920" y="520" width="200" height="104" rx="10" fill="#f7f3ff" stroke="#d9cdf5"/>
  <text x="940" y="551" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5b21b6">MQTT Broker</text>
  <text x="940" y="576" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">设备消息接入</text>
  <text x="940" y="598" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">可选外部服务</text>

  <rect x="80" y="658" width="1040" height="44" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="104" cy="680" r="4" fill="#16a34a"/>
  <text x="118" y="684" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#475569">配置读取</text>
  <circle cx="210" cy="680" r="4" fill="#d97706"/>
  <text x="224" y="684" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#475569">运行数据与控制</text>
  <circle cx="360" cy="680" r="4" fill="#94a3b8"/>
  <text x="374" y="684" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#475569">HTTP / JSON API</text>
  <text x="1100" y="684" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#94a3b8">轻量部署时使用内存降级</text>
</svg>
