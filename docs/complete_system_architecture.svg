<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
  <title id="title">kv-iot 完整系统架构</title>
  <desc id="desc">从设备接入、协议驱动、通道运行时、业务服务、数据存储到桌面端和移动端的完整架构链路。</desc>
  <defs>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1280" height="840" rx="16" fill="#f6f8fb"/>
  <text x="56" y="52" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">kv-iot 完整系统架构</text>
  <text x="56" y="82" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#64748b">设备接入、协议驱动、通道运行时、平台服务、数据存储与多端访问的完整链路。</text>
  <rect x="1010" y="32" width="134" height="30" rx="15" fill="#fff7e6" stroke="#f6cc87"/>
  <text x="1077" y="52" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" font-weight="600" fill="#b45309">云边一体</text>

  <text x="56" y="118" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">访问层</text>
  <rect x="40" y="94" width="1200" height="118" rx="14" fill="#eef4ff" stroke="#d4e1fb"/>
  <rect x="76" y="126" width="430" height="64" rx="10" fill="#ffffff" stroke="#c7d8f8"/>
  <text x="98" y="151" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">Web 管理端</text>
  <text x="98" y="174" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#64748b">配置、监控、指令、时序、事件与系统权限</text>
  <rect x="774" y="126" width="430" height="64" rx="10" fill="#ffffff" stroke="#c7d8f8"/>
  <text x="796" y="151" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">设备移动端</text>
  <text x="796" y="174" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#64748b">扫码访问、设备状态、最新采样与可用动作</text>
  <rect x="530" y="139" width="198" height="38" rx="8" fill="#ffffff" stroke="#d4e1fb"/>
  <text x="629" y="156" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">HTTP / JSON API</text>
  <text x="629" y="170" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#94a3b8">JWT 认证 · RBAC</text>

  <path d="M291 212 V228 M989 212 V228 M291 228 H989" fill="none" stroke="#7c8ea8" stroke-width="2"/>
  <path d="M210 228 V262 M535 228 V262 M965 228 V262" fill="none" stroke="#7c8ea8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <text x="56" y="286" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">服务层</text>
  <rect x="80" y="268" width="260" height="148" rx="12" fill="#ffffff" stroke="#bbebc9" stroke-width="2"/>
  <rect x="80" y="268" width="6" height="148" rx="3" fill="#16a34a"/>
  <text x="104" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">认证服务</text>
  <text x="104" y="323" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#15803d">auth · :8101</text>
  <text x="104" y="352" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">登录、JWT 与权限中间件</text>
  <text x="104" y="376" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">用户、角色、模块资源</text>
  <text x="104" y="400" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">RBAC 权限校验</text>

  <rect x="380" y="268" width="310" height="148" rx="12" fill="#ffffff" stroke="#bbebc9" stroke-width="2"/>
  <rect x="380" y="268" width="6" height="148" rx="3" fill="#16a34a"/>
  <text x="404" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">设备管理服务</text>
  <text x="404" y="323" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#15803d">device · :8100</text>
  <text x="404" y="352" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">产品、物模型、协议版本</text>
  <text x="404" y="376" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">点位绑定、设备、通道配置</text>
  <text x="404" y="400" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#475569">设备连接与共享信息</text>

  <rect x="730" y="268" width="470" height="148" rx="12" fill="#fffaf0" stroke="#f6cc87" stroke-width="2"/>
  <rect x="730" y="268" width="6" height="148" rx="3" fill="#d97706"/>
  <text x="754" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">数据中心服务</text>
  <text x="754" y="323" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#b45309">datacenter · :8102</text>
  <rect x="754" y="340" width="128" height="48" rx="7" fill="#ffffff" stroke="#f2d5a6"/>
  <text x="818" y="360" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">协议注册表</text>
  <text x="818" y="377" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#94a3b8">4 类驱动</text>
  <rect x="894" y="340" width="128" height="48" rx="7" fill="#ffffff" stroke="#f2d5a6"/>
  <text x="958" y="360" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">通道运行时</text>
  <text x="958" y="377" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#94a3b8">采集 / 重连 / 健康</text>
  <rect x="1034" y="340" width="142" height="48" rx="7" fill="#ffffff" stroke="#f2d5a6"/>
  <text x="1105" y="360" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">命令与事件</text>
  <text x="1105" y="377" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" fill="#94a3b8">指令 / 审计 / 查询</text>
  <text x="754" y="404" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#b45309">Runtime API 提供状态、时序、指令和事件接口</text>

  <text x="56" y="490" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">数据与接入层</text>
  <path d="M210 416 V504" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <path d="M535 416 V466 H310 V504" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <path d="M900 416 V446 H490 V504" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M966 416 V478 H760 V504" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M1050 416 V504" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="354" y="462" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#15803d">配置数据</text>
  <text x="668" y="470" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#b45309">运行状态 / 历史采样 / MQTT 接入</text>

  <rect x="80" y="504" width="260" height="112" rx="10" fill="#f7f3ff" stroke="#d9cdf5"/>
  <text x="100" y="536" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5b21b6">MySQL</text>
  <text x="100" y="562" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">用户、权限、产品、物模型</text>
  <text x="100" y="584" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">设备、点位、通道与共享配置</text>

  <rect x="370" y="504" width="240" height="112" rx="10" fill="#f7f3ff" stroke="#d9cdf5"/>
  <text x="390" y="536" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5b21b6">Redis</text>
  <text x="390" y="562" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">分布式最新运行状态</text>
  <text x="390" y="584" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">可选，失败时回退内存</text>

  <rect x="640" y="504" width="240" height="112" rx="10" fill="#f7f3ff" stroke="#d9cdf5"/>
  <text x="660" y="536" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5b21b6">InfluxDB</text>
  <text x="660" y="562" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">历史时序与设备采样</text>
  <text x="660" y="584" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">不可用时保留内存历史</text>

  <rect x="910" y="504" width="280" height="112" rx="10" fill="#f7f3ff" stroke="#d9cdf5"/>
  <text x="930" y="536" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5b21b6">MQTT Broker</text>
  <text x="930" y="562" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">设备消息发布与订阅</text>
  <text x="930" y="584" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b7280">支持外部 Mosquitto / EMQX</text>

  <text x="56" y="682" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">协议与设备层</text>
  <path d="M205 714 V674 M485 714 V674 M760 714 V674 M1040 714 V674 M205 674 H1224 V374 H1200" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="1216" y="516" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#2563eb" transform="rotate(90 1216 516)">采集数据 / 指令回传</text>

  <rect x="80" y="714" width="250" height="88" rx="10" fill="#eef4ff" stroke="#bdd3fa"/>
  <text x="205" y="746" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">MQTT 设备</text>
  <text x="205" y="770" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#64748b">属性、事件、动作消息</text>

  <rect x="360" y="714" width="250" height="88" rx="10" fill="#eef4ff" stroke="#bdd3fa"/>
  <text x="485" y="746" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Modbus TCP 设备</text>
  <text x="485" y="770" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#64748b">寄存器读取与写入</text>

  <rect x="640" y="714" width="240" height="88" rx="10" fill="#eef4ff" stroke="#bdd3fa"/>
  <text x="760" y="746" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">TCP Raw 设备</text>
  <text x="760" y="770" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#64748b">原始字节流协议</text>

  <rect x="920" y="714" width="240" height="88" rx="10" fill="#eef4ff" stroke="#bdd3fa"/>
  <text x="1040" y="746" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">TCP Frame 设备</text>
  <text x="1040" y="770" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#64748b">分帧报文协议</text>

  <text x="560" y="695" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#64748b">统一连接、采集、控制与健康检查</text>
  <text x="1203" y="695" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#64748b">内存状态与内存历史为边缘环境降级方案</text>
</svg>
